name: Reference Blueprints

on:
  pull_request:
  push:
    branches:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-reference-release:
    name: Resolve Reference Release
    runs-on: ubuntu-latest
    outputs:
      manifest_path: ${{ steps.resolve.outputs.manifest_path }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      rc: ${{ steps.resolve.outputs.rc }}
      toolchain: ${{ steps.resolve.outputs.toolchain }}
      verso_ref: ${{ steps.resolve.outputs.verso_ref }}
      branch: ${{ steps.resolve.outputs.branch }}
      deploy_pages: ${{ steps.resolve.outputs.deploy_pages }}
      reference_project_count: ${{ steps.resolve.outputs.reference_project_count }}
      reference_matrix: ${{ steps.resolve.outputs.reference_matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve release metadata
        id: resolve
        run: python3 ./scripts/emit_reference_release_matrix.py --github-output >> "$GITHUB_OUTPUT"

  build-reference-blueprints:
    name: Build Reference ${{ matrix.project_id }}
    runs-on: ubuntu-latest
    needs: resolve-reference-release
    if: ${{ needs.resolve-reference-release.outputs.reference_project_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-reference-release.outputs.reference_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Show resolved release target
        run: |
          echo "release_id=${{ needs.resolve-reference-release.outputs.release_id }}"
          echo "rc=${{ matrix.rc }}"
          echo "toolchain=${{ matrix.toolchain }}"
          echo "verso_ref=${{ matrix.verso_ref }}"
          echo "blueprint=${{ matrix.project_id }}"
          echo "hash=${{ matrix.hash }}"
          echo "reference_source_identity=${{ matrix.reference_source_identity }}"
      - name: Match reference target toolchain
        run: printf 'leanprover/lean4:${{ matrix.toolchain }}\n' > lean-toolchain
      - name: Report disk usage before cache restore
        run: ./scripts/report-ci-disk-usage.sh "before cache restore" --reference-source-identity "${{ matrix.reference_source_identity }}" --artifact-path "${{ matrix.artifact_path }}"
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pygments \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-luatex \
            texlive-plain-generic
      - name: Restore Lake package cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib
            .lake/packages/verso
          key: ${{ runner.os }}-lake-packages-v2-${{ matrix.toolchain }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v2-${{ matrix.toolchain }}-
            ${{ runner.os }}-lake-packages-v2-
      - name: Restore Lake dependency build cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib/.lake/build
            .lake/packages/verso/.lake/build
          key: ${{ runner.os }}-lake-deps-${{ matrix.toolchain }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-${{ matrix.toolchain }}-
            ${{ runner.os }}-lake-deps-
      - name: Report disk usage after Lake cache restore
        run: ./scripts/report-ci-disk-usage.sh "after Lake cache restore" --reference-source-identity "${{ matrix.reference_source_identity }}" --artifact-path "${{ matrix.artifact_path }}"
      - name: Restore external reference dependency cache
        if: ${{ matrix.reference_source_identity != '' }}
        uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.reference_dependency_packages_path }}
            ${{ matrix.reference_dependency_path_builds_path }}
          key: ${{ runner.os }}-reference-deps-v2-${{ matrix.reference_source_identity }}
          restore-keys: |
            ${{ runner.os }}-reference-deps-v2-${{ matrix.project_id }}-
      - name: Report disk usage after reference cache restore
        run: ./scripts/report-ci-disk-usage.sh "after reference cache restore" --reference-source-identity "${{ matrix.reference_source_identity }}" --artifact-path "${{ matrix.artifact_path }}"
      - name: Show tool versions
        run: |
          lean --version
          lake --version
          lualatex --version | head -n 1
          python3 --version
      - name: Generate reference blueprint with PDF
        run: ./scripts/generate-reference-blueprints.sh --allow-unsafe-root-release --pdf --project ${{ matrix.project_id }}
      - name: Report disk usage after reference generation
        if: ${{ always() }}
        run: ./scripts/report-ci-disk-usage.sh "after reference generation" --reference-source-identity "${{ matrix.reference_source_identity }}" --artifact-path "${{ matrix.artifact_path }}"
      - name: Upload reference blueprint artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  build-test-blueprints:
    name: Build Test Blueprints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake package cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib
            .lake/packages/verso
          key: ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v2-
      - name: Restore Lake dependency build cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib/.lake/build
            .lake/packages/verso/.lake/build
          key: ${{ runner.os }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-deps-
      - name: Show tool versions
        run: |
          lean --version
          lake --version
          python3 --version
      - name: Generate test blueprints
        run: ./scripts/generate-test-blueprints.sh
      - name: Upload test blueprint artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-blueprints
          path: _out/test-blueprints

  build-site-artifact:
    name: Build Site Artifact
    runs-on: ubuntu-latest
    needs:
      - resolve-reference-release
      - build-reference-blueprints
      - build-test-blueprints
    if: ${{ needs.resolve-reference-release.outputs.deploy_pages == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Show deploy release target
        run: |
          echo "release_id=${{ needs.resolve-reference-release.outputs.release_id }}"
          echo "deploy_pages=${{ needs.resolve-reference-release.outputs.deploy_pages }}"
      - name: Download reference blueprint artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: reference-blueprints-*
          path: _out/reference-blueprints-artifacts
      - name: Download test blueprints artifact
        uses: actions/download-artifact@v7
        with:
          name: test-blueprints
          path: _out/test-blueprints
      - name: Prepare site artifact
        run: python3 ./scripts/prepare_reference_blueprints_pages.py --reference-root _out/reference-blueprints-artifacts
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: reference-blueprints-site
          path: _site
