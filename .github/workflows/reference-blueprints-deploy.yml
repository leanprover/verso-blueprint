name: Reference Blueprints Deploy

on:
  workflow_run:
    workflows:
      - Reference Blueprints
    types:
      - completed
    branches:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-deploy-releases:
    name: Resolve Deploy Releases
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      controller_revision: ${{ steps.controller.outputs.commit }}
      deployable_project_count: ${{ steps.resolve.outputs.deployable_project_count }}
      deployable_project_matrix: ${{ steps.resolve.outputs.deployable_project_matrix }}
    steps:
      - uses: actions/checkout@v5
        id: controller
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check validated release revision
        id: release
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          if current=$(git rev-parse --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH") &&
              [[ "$current" == "$VALIDATED_REVISION" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded validation of $RELEASE_BRANCH at $VALIDATED_REVISION."
          fi
      - name: Resolve deploy release metadata
        id: resolve
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.current == 'true'
        run: python3 ./scripts/emit_reference_deploy_matrix.py --github-output >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-deploy-releases
    if: fromJSON(needs.resolve-deploy-releases.outputs.deployable_project_count || '0') > 0
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-reference-blueprints.yml
    with:
      controller_revision: ${{ needs.resolve-deploy-releases.outputs.controller_revision }}
      project_matrix: ${{ needs.resolve-deploy-releases.outputs.deployable_project_matrix }}
