name: Reference Blueprints Deploy

on:
  workflow_run:
    workflows:
      - Reference Blueprints
    types:
      - completed
    branches:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-deploy-releases:
    name: Resolve Deploy Releases
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      controller_revision: ${{ steps.controller.outputs.commit }}
      deployable_project_count: ${{ steps.resolve.outputs.deployable_project_count }}
      deployable_project_matrix: ${{ steps.resolve.outputs.deployable_project_matrix }}
    steps:
      - uses: actions/checkout@v5
        id: controller
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Resolve deploy release metadata
        id: resolve
        if: github.event_name == 'workflow_run' || steps.controller.outputs.commit == github.sha
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            args+=(--validated-push "$RELEASE_BRANCH" "$VALIDATED_REVISION")
          fi
          python3 scripts/emit_reference_deploy_matrix.py "${args[@]}" --github-output >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-deploy-releases
    if: fromJSON(needs.resolve-deploy-releases.outputs.deployable_project_count || '0') > 0
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-reference-blueprints.yml
    with:
      controller_revision: ${{ needs.resolve-deploy-releases.outputs.controller_revision }}
      project_matrix: ${{ needs.resolve-deploy-releases.outputs.deployable_project_matrix }}
